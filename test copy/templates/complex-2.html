<div class="user-card">
  <h2><%= user.name %></h2>
  <p>Email: <%= user.email %></p>

  <% if (user.roles.length) { %>
  <ul class="roles">
    <% for (let role of user.roles) { %>
    <li class="<%= role === 'admin' ? 'highlight' : '' %>"><%= role %></li>
    <% } %>
  </ul>
  <% } else { %>
  <p>No roles assigned</p>
  <% } %>

  <div class="status">
    <% if (user.isActive) { %>
    <span class="badge active">Active</span>
    <% } else { %>
    <span class="badge inactive">Inactive</span>
    <% } %>
  </div>
</div>
